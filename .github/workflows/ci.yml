name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm test
      - name: Check Python and shell entry points
        run: |
          python scripts/transcribe_media.py --help
          python .agents/skills/video-shorts/scripts/normalize_transcript.py --help
          bash -n start.command scripts/setup_whisper.sh
      - name: Install FFmpeg for the synthetic integration test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Render and decode synthetic captioned video
        if: runner.os == 'Linux'
        run: npm run smoke
